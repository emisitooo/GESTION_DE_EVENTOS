<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cerrar Sesion</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<script>
function confirmarCerrar(){

    let respuesta = confirm("¿Estás seguro de que deseas cerrar la sesión?");

    if(respuesta){
        return true; // Continúa al inicio de sesión
    }else{
        return false; // Cancela y permanece en la página
    }

}
</script>

</body>
</html>
